# esbuild (tsx + vitest) needs a post-install script to fetch its platform binary;
# pnpm blocks that by default.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
  core-js-pure: false

overrides:
  # Force esbuild (transitive via tsx + vitest) to the patched 0.28.1 — earlier
  # versions have a high-severity advisory (GHSA-gv7w-rqvm-qjhr).
  esbuild: ">=0.28.1"
  # @modelcontextprotocol/node (the Node HTTP entry, src/http-server.ts) pins
  # @hono/node-server ^1.19.9, which has no patched 1.x for a serve-static advisory.
  # This override forces the patched 2.x line instead — actively load-bearing, unlike
  # a Cloudflare-Worker-era version of this override that predates this fork.
  "@hono/node-server": "^2.0.5"
